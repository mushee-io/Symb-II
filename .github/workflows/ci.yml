name: Build
concurrency:
  group: symb-ii-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check public release verification scripts
        run: |
          node --check scripts/smoke.mjs
          node --check scripts/verify-m9-public.mjs
          node --check scripts/verify-financial-boundary.mjs
      - name: Enforce read-only financial security boundary
        run: node scripts/verify-financial-boundary.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
