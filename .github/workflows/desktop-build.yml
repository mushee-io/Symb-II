name: Windows desktop installer candidate (unsigned internal test)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
      - 'tests/windows-desktop-candidate.test.mjs'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
      - 'tests/windows-desktop-candidate.test.mjs'

permissions:
  contents: read

concurrency:
  group: symb-ii-windows-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-internal-candidate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
    steps:
      - name: Check out pinned repository revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Windows Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check native desktop sandbox, navigation and release boundaries
        shell: pwsh
        run: |
          node --test tests/desktop-navigation.test.mjs tests/desktop-signing-policy.test.mjs tests/windows-desktop-candidate.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop security checks did not pass.' }
      - name: Install pinned Electron desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Package Windows x64 NSIS candidate (unsigned, not published)
        working-directory: desktop
        run: npm run pack:win
      - name: Verify Windows executable, sandbox payload and SHA256 integrity
        shell: pwsh
        run: |
          ./desktop/verify-windows-candidate.ps1 -DistPath 'desktop/dist'
          # Script throws on failure; a PowerShell script does not reliably
          # reset LASTEXITCODE from an earlier native command on success.
      - name: Upload private short-lived Windows candidate for independent device testing
        uses: actions/upload-artifact@v4
        with:
          name: symb-ii-windows-internal-${{ github.sha }}
          path: |
            desktop/dist/Symb-II-Setup-*.exe
            desktop/dist/SHA256SUMS.txt
            desktop/dist/windows-candidate.json
          if-no-files-found: error
          retention-days: 7
