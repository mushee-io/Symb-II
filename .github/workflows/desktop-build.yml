name: Desktop application builds (unsigned internal test only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            target: pack:win
          - os: macos-latest
            name: macos
            target: pack:mac
          - os: ubuntu-latest
            name: linux
            target: pack:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check desktop allowlist, sandbox and wallet limits
        run: node --test tests/desktop-navigation.test.mjs
      - name: Install desktop runtime
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build unsigned internal desktop package
        working-directory: desktop
        run: npm run ${{ matrix.target }}
      - name: Store short-lived unsigned CI artifact, not a release
        uses: actions/upload-artifact@v4
        with:
          name: symb-ii-unsigned-${{ matrix.name }}-${{ github.sha }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 3
